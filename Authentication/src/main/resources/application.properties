spring.application.name=Authentication
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.cookie.secure=${COOKIE_SECURE:false}
