<section class="article-editor">
  <h1>{{ id === null ? 'Új cikk' : 'Cikk szerkesztése' }}</h1>
  <form #articleForm="ngForm" (ngSubmit)="onSubmit()">
    <label for="title">Cím</label>
    <input id="title" name="title" [(ngModel)]="title" required />

    <label for="category">Kategória</label>
    <select id="category" name="category" [(ngModel)]="category" required>
      <option value="" disabled>Válassz kategóriát</option>
      @for (cat of categories; track cat) {
        <option [value]="cat">{{ cat }}</option>
      }
    </select>

    <label for="introduction">Bevezető</label>
    <textarea id="introduction" name="introduction" [(ngModel)]="introduction" rows="3" required></textarea>

    <label for="content">Cikk tartalma</label>
    <textarea id="content" name="content" [(ngModel)]="content" rows="8" required></textarea>

    <label for="image">Kép URL-je</label>
    <input id="image" name="image" [(ngModel)]="image" type="url" required />

    <label class="frontpage-option">
      <input name="frontpage" [(ngModel)]="frontpage" type="checkbox" />
      Jelenjen meg a címlapon
    </label>

    <button type="submit" [disabled]="articleForm.invalid">{{ id === null ? 'Cikk mentése' : 'Módosítások mentése' }}</button>
  </form>

  @if (submittedArticle) {
    <p role="status">{{ id === null ? 'A cikk sikeresen mentve.' : 'A cikk módosításai sikeresen mentve.' }} Azonosító: {{ submittedArticle.id }}</p>
  }
</section>
